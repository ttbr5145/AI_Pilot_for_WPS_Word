<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>素材库</title>
</head>
<script type="text/javascript" src="../js/materialpane.js"></script>
<script type="text/javascript" src="../.debugTemp/wpsjsrpcsdk.js"></script>

<body>
    <div class="container">
        <div class="header">
            <span class="header-title">素材库</span>
            <div class="header-actions">
                <button class="add-btn" onclick="showAddDialog()" title="添加素材">+</button>
                <button class="refresh-btn" onclick="displayMaterials()" title="刷新素材库">🔄</button>
            </div>
        </div>
        <div class="materials-container">
            <div class="materials-list" id="materialsList">
                <!-- 素材列表将在这里动态生成 -->
            </div>
        </div>
    </div>

    <!-- 添加素材对话框 -->
    <div id="addDialog" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加素材</h3>
                <button class="close-btn" onclick="closeAddDialog()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="materialInput" placeholder="请输入要添加的素材内容..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAddDialog()">取消</button>
                <button class="btn-primary" onclick="addMaterial()">添加</button>
            </div>
        </div>
    </div>

    <!-- 编辑素材对话框 -->
    <div id="editDialog" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑素材</h3>
                <button class="close-btn" onclick="closeEditDialog()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="editMaterialContent" placeholder="编辑素材内容..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditDialog()">取消</button>
                <button class="btn-primary" onclick="saveEditMaterial()">保存</button>
            </div>
        </div>
    </div>
</body>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f0f0f0;
        height: 100vh;
    }

    .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        background-color: white;
    }

    .header {
        padding: 10px 12px;
        background-color: transparent;
        color: #2b579a;
        border-bottom: 2px solid #2b579a;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }

    .header-title {
        font-size: 14px;
        font-weight: normal;
    }

    .header-actions {
        display: flex;
        gap: 4px;
    }

    .add-btn {
        background: #2b579a;
        border: none;
        color: white;
        font-size: 16px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        font-weight: bold;
    }

    .add-btn:hover {
        background-color: #3a6ea5;
    }

    .refresh-btn {
        background: transparent;
        border: none;
        color: #2b579a;
        font-size: 16px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
    }

    .refresh-btn:hover {
        background-color: rgba(43, 87, 154, 0.1);
    }

    .materials-container {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        background-color: white;
    }

    .materials-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .material-item {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 12px;
        background-color: #fafafa;
    }

    .material-content {
        font-size: 13px;
        line-height: 1.5;
        color: #333;
        margin-bottom: 8px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .material-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #666;
    }

    .material-time {
        flex: 1;
    }

    .material-actions {
        display: flex;
        gap: 6px;
    }

    .action-btn {
        padding: 3px 8px;
        font-size: 11px;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        cursor: pointer;
        background: white;
        transition: background-color 0.15s;
    }

    .action-btn:hover {
        background-color: #f0f0f0;
    }

    .insert-btn:hover {
        background-color: #e3f2fd;
        border-color: #2196f3;
    }

    .copy-btn:hover {
        background-color: #e8f5e8;
        border-color: #4caf50;
    }

    .delete-btn:hover {
        background-color: #ffebee;
        border-color: #f44336;
    }

    .empty-state {
        text-align: center;
        color: #999;
        padding: 40px 20px;
        font-size: 14px;
    }

    /* 模态框样式 */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background-color: white;
        border-radius: 3px;
        width: 90%;
        max-width: 400px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f0f0f0;
    }

    .modal-header h3 {
        font-size: 14px;
        font-weight: normal;
        margin: 0;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #666;
        padding: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-btn:hover {
        color: #333;
    }

    .modal-body {
        padding: 15px;
    }

    .modal-body textarea {
        width: 100%;
        min-height: 120px;
        padding: 8px;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
        box-sizing: border-box;
    }

    .modal-body textarea:focus {
        outline: none;
        border-color: #2b579a;
    }

    .modal-footer {
        padding: 12px 15px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background-color: #f8f8f8;
    }

    .btn-primary,
    .btn-secondary {
        padding: 6px 16px;
        border: none;
        border-radius: 2px;
        font-size: 13px;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #2b579a;
        color: white;
    }

    .btn-primary:hover {
        background-color: #3a6ea5;
    }

    .btn-secondary {
        background-color: #f0f0f0;
        color: #333;
        border: 1px solid #d0d0d0;
    }

    .btn-secondary:hover {
        background-color: #e0e0e0;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
        width: 10px;
    }

    ::-webkit-scrollbar-track {
        background: #f0f0f0;
    }

    ::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border: 2px solid #f0f0f0;
        border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #a0a0a0;
    }
</style>

</html>
