<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>素材库</title>
</head>
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/materialpane.js"></script>
<script type="text/javascript" src="../.debugTemp/wpsjsrpcsdk.js"></script>

<body>
    <div class="container">
        <div class="header">
            <h2>素材库</h2>
            <button class="btn-small" onclick="clearAllMaterials()">清空</button>
        </div>
        <div class="input-area">
            <textarea id="materialInput" placeholder="输入素材内容..."></textarea>
            <button class="btn-primary" onclick="addMaterial()">添加</button>
        </div>
        <div class="materials-container" id="materialsContainer">
            <div class="empty-state">
                <p>暂无素材</p>
            </div>
        </div>
    </div>

    <!-- 编辑素材对话框 -->
    <div id="editDialog" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑素材</h3>
                <button class="close-btn" onclick="closeEditDialog()">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="editMaterialContent" placeholder="编辑素材内容..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditDialog()">取消</button>
                <button class="btn-primary" onclick="saveEditMaterial()">保存</button>
            </div>
        </div>
    </div>
</body>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f0f0f0;
        height: 100vh;
    }

    .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        background-color: white;
    }

    .header {
        padding: 12px 15px;
        background-color: transparent;
        color: #2b579a;
        border-bottom: 2px solid #2b579a;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header h2 {
        font-size: 14px;
        font-weight: normal;
        margin: 0;
    }

    .btn-small {
        padding: 4px 12px;
        background-color: transparent;
        color: #2b579a;
        border: 1px solid #2b579a;
        border-radius: 2px;
        font-size: 12px;
        cursor: pointer;
    }

    .btn-small:hover {
        background-color: rgba(43, 87, 154, 0.1);
    }

    .input-area {
        padding: 10px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #materialInput {
        width: 100%;
        height: 80px;
        padding: 8px;
        border: 1px solid #d0d0d0;
        resize: none;
        font-size: 13px;
        font-family: inherit;
    }

    #materialInput:focus {
        outline: none;
        border-color: #2b579a;
    }

    .btn-primary {
        padding: 6px 16px;
        background-color: #2b579a;
        color: white;
        border: none;
        border-radius: 2px;
        font-size: 13px;
        cursor: pointer;
        align-self: flex-end;
    }

    .btn-primary:hover {
        background-color: #3a6ea5;
    }

    .materials-container {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
    }

    .material-item {
        background-color: white;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        padding: 10px;
        margin-bottom: 8px;
    }

    .material-content {
        font-size: 13px;
        line-height: 1.5;
        color: #333;
        margin-bottom: 8px;
        word-wrap: break-word;
        max-height: 80px;
        overflow-y: auto;
    }

    .material-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #e8e8e8;
        padding-top: 6px;
    }

    .material-time {
        font-size: 11px;
        color: #999;
    }

    .material-actions {
        display: flex;
        gap: 6px;
    }

    .action-btn {
        padding: 3px 10px;
        font-size: 12px;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        cursor: pointer;
        background-color: white;
        color: #333;
    }

    .action-btn:hover {
        background-color: #f0f0f0;
    }

    .btn-edit {
        background-color: #e8f4f8;
        color: #1976d2;
    }

    .btn-edit:hover {
        background-color: #d4eef7;
    }

    .btn-insert {
        background-color: #f3e5f5;
        color: #7b1fa2;
    }

    .btn-insert:hover {
        background-color: #e1bee7;
    }

    .btn-copy {
        background-color: #fff3e0;
        color: #f57c00;
    }

    .btn-copy:hover {
        background-color: #ffe0b2;
    }

    .btn-delete {
        background-color: #ffebee;
        color: #c62828;
    }

    .btn-delete:hover {
        background-color: #ffcdd2;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #999;
    }

    .empty-state p {
        font-size: 13px;
    }

    /* 模态框样式 */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background-color: white;
        border-radius: 3px;
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f0f0f0;
    }

    .modal-header h3 {
        font-size: 14px;
        font-weight: normal;
        margin: 0;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #666;
        padding: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-btn:hover {
        color: #333;
    }

    .modal-body {
        padding: 15px;
    }

    #editMaterialContent {
        width: 100%;
        height: 150px;
        padding: 8px;
        border: 1px solid #d0d0d0;
        resize: none;
        font-size: 13px;
        font-family: inherit;
    }

    #editMaterialContent:focus {
        outline: none;
        border-color: #2b579a;
    }

    .modal-footer {
        padding: 12px 15px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background-color: #f0f0f0;
    }

    .btn-secondary {
        padding: 6px 16px;
        background-color: white;
        color: #333;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        font-size: 13px;
        cursor: pointer;
    }

    .btn-secondary:hover {
        background-color: #f0f0f0;
    }
</style>

</html>
