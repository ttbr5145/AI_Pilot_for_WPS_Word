<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI对话</title>
</head>
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/ai-config.js"></script>
<script type="text/javascript" src="../js/aipane.js"></script>
<script type="text/javascript" src="../.debugTemp/wpsjsrpcsdk.js"></script>

<body>
    <div class="container">
        <div class="header">
            <span class="header-title">AI助手</span>
            <div class="header-actions">
                <button class="icon-btn" onclick="showSettings()" title="设置">⚙</button>
                <button class="icon-btn" onclick="clearChat()" title="清空对话">🗑</button>
            </div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="system-message">
                你好！我是AI助手，有什么可以帮助你的？
            </div>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="输入你的问题... (Enter发送，Shift+Enter换行)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
</body>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f0f0f0;
        height: 100vh;
    }

    .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        background-color: white;
    }

    .header {
        padding: 10px 12px;
        background-color: transparent;
        color: #2b579a;
        border-bottom: 2px solid #2b579a;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-title {
        font-size: 14px;
        font-weight: normal;
    }

    .header-actions {
        display: flex;
        gap: 4px;
    }

    .icon-btn {
        background: transparent;
        border: none;
        color: #2b579a;
        font-size: 16px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
    }

    .icon-btn:hover {
        background-color: rgba(43, 87, 154, 0.1);
    }

    .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        background-color: white;
    }

    .message {
        margin-bottom: 12px;
        display: flex;
    }

    .message.user-message {
        justify-content: flex-end;
    }

    .message-content {
        max-width: 85%;
        padding: 10px 12px;
        border-radius: 3px;
        word-wrap: break-word;
        line-height: 1.5;
        white-space: pre-wrap;
        position: relative;
        font-size: 13px;
    }

    .ai-message .message-actions {
        margin-top: 8px;
        display: flex;
        gap: 4px;
    }

    .message-action-btn {
        padding: 3px 8px;
        font-size: 11px;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        cursor: pointer;
        background: white;
        transition: background-color 0.15s;
    }

    .message-action-btn:hover {
        background-color: #f0f0f0;
    }

    .user-message .message-content {
        background-color: #2b579a;
        color: white;
    }

    .system-message {
        padding: 10px 12px;
        color: #666;
        font-size: 13px;
        border-bottom: 1px solid #e0e0e0;
    }

    .ai-message .message-content {
        background-color: transparent;
        border: none;
        color: #333;
        max-width: 100%;
    }

    .ai-message {
        width: 100%;
        flex-direction: column;
    }

    .input-area {
        padding: 10px;
        border-top: 1px solid #e0e0e0;
        background-color: white;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #userInput {
        width: 100%;
        height: 70px;
        padding: 8px;
        border: 1px solid #d0d0d0;
        resize: none;
        font-size: 13px;
        font-family: inherit;
    }

    #userInput:focus {
        outline: none;
        border-color: #2b579a;
    }

    #sendBtn {
        padding: 6px 16px;
        background-color: #2b579a;
        color: white;
        border: none;
        border-radius: 2px;
        font-size: 13px;
        cursor: pointer;
        align-self: flex-end;
    }

    #sendBtn:hover {
        background-color: #3a6ea5;
    }

    #sendBtn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }

    ::-webkit-scrollbar {
        width: 10px;
    }

    ::-webkit-scrollbar-track {
        background: #f0f0f0;
    }

    ::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border: 2px solid #f0f0f0;
        border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #a0a0a0;
    }

    /* 模态框样式 */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background-color: white;
        border-radius: 3px;
        width: 90%;
        max-width: 400px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f0f0f0;
    }

    .modal-header h3 {
        font-size: 14px;
        font-weight: normal;
        margin: 0;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #666;
        padding: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-btn:hover {
        color: #333;
    }

    .modal-body {
        padding: 15px;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        color: #333;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        font-size: 13px;
        font-family: inherit;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #2b579a;
    }

    .form-group textarea {
        min-height: 80px;
        resize: vertical;
    }

    .modal-footer {
        padding: 12px 15px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background-color: #f8f8f8;
    }

    .btn-primary,
    .btn-secondary {
        padding: 6px 16px;
        border: none;
        border-radius: 2px;
        font-size: 13px;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #2b579a;
        color: white;
    }

    .btn-primary:hover {
        background-color: #3a6ea5;
    }

    .btn-secondary {
        background-color: #f0f0f0;
        color: #333;
        border: 1px solid #d0d0d0;
    }

    .btn-secondary:hover {
        background-color: #e0e0e0;
    }

    .empty-state {
        text-align: center;
        color: #999;
        padding: 40px 20px;
        font-size: 14px;
    }
</style>
</html>
